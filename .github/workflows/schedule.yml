name: Automatizacion_AppMendozaSolYVino

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-script:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout del código
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          if [ -f requirements.txt ]; then pip install --no-cache-dir -r requirements.txt; fi

      - name: Ejecutar script de Python
        # env:
        #   MI_API_KEY: ${{ secrets.MI_API_KEY }}
        run: python3 main.py

      - name: Guardar cambios en el repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Actividades/
          git add data.json
          git diff --staged --quiet || git commit -m "chore: nueva actividad $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git pull --rebase
          git push
